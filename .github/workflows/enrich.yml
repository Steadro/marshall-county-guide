name: Apply enrichment to Neon

# Vercel-style data pipeline:
#   - Open/update a PR that changes data/enrichment/*.json  -> dry-run preview (no writes)
#   - Merge to main                                          -> apply changed batches to Neon
# Only the batch files changed in the push/PR are applied (idempotent UPDATEs).
# Enrichment edits existing rows, which ISR (revalidate = 3600) picks up within
# ~1h, so no Vercel redeploy is triggered here. Net-new businesses still need a
# rebuild because the dynamic routes set dynamicParams = false.

on:
  pull_request:
    paths:
      - "data/enrichment/**.json"
  push:
    branches: [main]
    paths:
      - "data/enrichment/**.json"
  # Manual button: dry-run every batch (preview + connectivity smoke test, no writes).
  workflow_dispatch:

# Never let two applies race the same database.
concurrency:
  group: enrich-neon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Job-level so postinstall (prisma generate) can resolve DATABASE_URL too.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff which batches changed

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine changed batch files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            FILES=$(git diff --name-only --diff-filter=AM \
              "origin/${{ github.base_ref }}...HEAD" -- 'data/enrichment/*.json')
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FILES=$(git diff-tree --no-commit-id --name-only -r \
                "${{ github.sha }}" -- 'data/enrichment/*.json')
            else
              FILES=$(git diff --name-only --diff-filter=AM \
                "$BEFORE" "${{ github.sha }}" -- 'data/enrichment/*.json')
            fi
          fi
          echo "Changed batches:"; echo "$FILES"
          # collapse to a space-separated list for the next step
          echo "files=$(echo $FILES | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Dry-run (pull request)
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        run: npx tsx scripts/apply-enrichment.ts --dry-run ${{ steps.changed.outputs.files }}

      - name: Apply to Neon (merge to main)
        if: github.event_name == 'push' && steps.changed.outputs.files != ''
        run: npx tsx scripts/apply-enrichment.ts ${{ steps.changed.outputs.files }}

      - name: Dry-run all batches (manual)
        if: github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/apply-enrichment.ts --dry-run
